# One-command startup: `docker compose up` brings up the backend (auto-migrate + seed) and
# the frontend, pre-wired. CORS is set to the frontend origin and NEXT_PUBLIC_API_BASE to the
# backend, so the app connects with zero manual env editing.
#
# Fresh-start defaults ship a REAL, runnable research app: no demo seed rows, external sources
# (OpenAlex) ON. A plain `./scripts/build.sh` — no env vars — brings up a clean, empty workspace
# ready for the first real run once a provider key is connected in the UI.
#   Load the demo dataset instead:  NOETARCH_SEED_DEMO=true docker compose up
#   Turn external sources off:      NOETARCH_EXTERNAL_SOURCES_ENABLED=false docker compose up
services:
  backend:
    build: ./backend
    environment:
      NOETARCH_CORS_ALLOW_ORIGINS: "http://localhost:3000"
      NOETARCH_DATABASE_URL: "sqlite:////data/noetarch.db"
      # Real mode by default (clean, empty DB); set NOETARCH_SEED_DEMO=true for the demo dataset.
      NOETARCH_SEED_DEMO: "${NOETARCH_SEED_DEMO:-false}"
      # Egress stays behind this single flag AND the allowlist; ON by default so real runs work.
      NOETARCH_EXTERNAL_SOURCES_ENABLED: "${NOETARCH_EXTERNAL_SOURCES_ENABLED:-true}"
      NOETARCH_EGRESS_CONTACT_EMAIL: "${NOETARCH_EGRESS_CONTACT_EMAIL:-}"
    volumes:
      - noetarch-db:/data
    # Bind to loopback only — never expose the API on all host interfaces.
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: "http://localhost:8000"
    # Bind to loopback only — never expose the frontend on all host interfaces.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  noetarch-db:
